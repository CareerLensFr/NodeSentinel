name: ShellCheck

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  shellcheck:
    name: Lint Bash avec ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Linter les scripts principaux
        run: shellcheck -x monitor.sh install.sh uninstall.sh config.sh

      - name: Linter les modules lib/
        run: shellcheck -x lib/*.sh
