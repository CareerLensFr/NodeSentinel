name: ShellCheck

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint Bash avec ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Linter les scripts Shell
        run: |
          shellcheck -x monitor.sh install.sh uninstall.sh config.sh
          shellcheck -x lib/*.sh
